<template>
    <div class="page">

        <div class="header">
            <div class="header-content">
                <div class="greeting">
                    <p class="eyebrow">Field Day</p>
                    <h2>Hello, {userName}</h2>
                    <p class="subtitle">Let's crush your goals today.</p>
                </div>
                <div class="header-actions">
                    <template if:true={showStartDayButton}>
                        <button class="day-btn start" onclick={handleStartDay} type="button" disabled={startDayDisabled}>
                            <lightning-icon icon-name="utility:play" size="x-small"></lightning-icon>
                            Start Day
                        </button>
                    </template>
                    <template if:true={showEndDayButton}>
                        <button class="day-btn end" onclick={handleEndDay} type="button" disabled={endDayDisabled}>
                            End Day
                        </button>
                    </template>
                    <template if:true={showDayEndedButton}>
                        <button class="day-btn ended" type="button" disabled>
                            <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                            Day Ended
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <div class="calendar-bar card-anim">
            <button class="nav-btn" onclick={handlePrevWindow} type="button">
                <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
            </button>

            <div class="date-strip">
                <template for:each={dateOptions} for:item="d">
                    <button key={d.value} class={d.class} data-date={d.value} onclick={handleDateChange} type="button">
                        <span class="day">{d.day}</span>
                        <span class="date-num">{d.date}</span>
                    </button>
                </template>
            </div>

            <button class="today-btn" onclick={handleTodayJump} type="button">Today</button>

            <button class="nav-btn" onclick={handleNextWindow} type="button">
                <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
            </button>
        </div>

        <button class="timeline-fab" onclick={handleTimelineClick} type="button" title="Timeline">
            <lightning-icon icon-name="utility:fallback" size="small"></lightning-icon>
        </button>

        <template if:true={timelineOpen}>
            <div class="timeline-backdrop" onclick={handleTimelineClick}></div>
            <section class="timeline-popup" role="dialog" aria-modal="true">
                <div class="timeline-popup-header">
                    <div class="timeline-popup-title">
                        <lightning-icon icon-name="utility:fallback" size="x-small"></lightning-icon>
                        <span>Timeline</span>
                    </div>
                    <button class="icon-btn" onclick={handleTimelineClick} type="button" title="Close">
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <div class="timeline-popup-body">
                    <template if:true={timelineLoading}>
                        <div class="timeline-loading">
                            <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={timelineLoading}>
                        <template if:true={timelineVisits.length}>
                            <template for:each={timelineVisits} for:item="visit">
                                <c-visit-tile
                                    key={visit.Id}
                                    visit={visit}
                                    day-started={dayStarted}
                                    day-ended={dayEnded}
                                    is-today={isToday}
                                    show-connector
                                    onrefresh={handleRefresh}
                                    onopenvisit={handleOpenVisit}>
                                </c-visit-tile>
                            </template>
                        </template>

                        <template if:false={timelineVisits.length}>
                            <div class="empty-state">
                                <p class="empty-sub">No timeline visits for this date.</p>
                            </div>
                        </template>
                    </template>
                </div>
            </section>
        </template>

        <div class="summary-row card-anim" style="animation-delay: 0.12s">
            <div class="summary-pill progress summary-progress">
                <span class="pill-label">Progress</span>
                <strong class="pill-value">{progressPercentage}%</strong>
                <div class="progress-bar-mini">
                    <div class="fill" style={progressStyle}></div>
                </div>
            </div>
            <div class={summaryCompletedClass}>
                <span class="pill-label">Completed</span>
                <strong class="pill-value">{completedCount}</strong>
            </div>
            <div class={summaryProgressClass}>
                <span class="pill-label">In Progress</span>
                <strong class="pill-value">{inProgressCount}</strong>
            </div>
            <div class={summaryPendingClass}>
                <span class="pill-label">Pending</span>
                <strong class="pill-value">{pendingCount}</strong>
            </div>
        </div>

        <div class="beat-container card-anim" style="animation-delay: 0.2s">
            <button class="beat-card" onclick={handleBeatToggle} type="button">
                <div class="beat-info">
                    <p class="beat-label-small">Current Beat</p>
                    <div class="beat-name">{beatLabel}</div>
                </div>
                <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
            </button>

            <template if:true={showBeatDropdown}>
                <div class="beat-list">
                    <template for:each={beats} for:item="beat">
                        <button key={beat.Id} class="beat-item" data-id={beat.Id} data-name={beat.Name} onclick={handleBeatSelect} type="button">
                            <div class="beat-item-main">
                                <span class="beat-item-name">{beat.Name}</span>
                                <template if:true={beat.rangeLabel}>
                                    <span class="beat-item-sub">{beat.rangeLabel}</span>
                                </template>
                            </div>
                            <lightning-icon class="beat-item-icon" icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                        </button>
                    </template>
                </div>
            </template>
        </div>

        <div class="visits card-anim" style="animation-delay: 0.25s">
            <template if:false={viewMode}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:checkin" size="medium" variant="inverse" class="slds-m-bottom_small"></lightning-icon>
                    <p class="empty-title">Ready to work?</p>
                    <p class="empty-sub">Select a beat above to see your stops.</p>
                </div>
            </template>

            <template if:true={viewMode}>
                <template if:true={visits.length}>
                    <template for:each={visits} for:item="visit">
                        <c-visit-tile
                            key={visit.Id}
                            visit={visit}
                            day-started={dayStarted}
                            day-ended={dayEnded}
                            is-today={isToday}
                            show-connector={isTimelineMode}
                            onrefresh={handleRefresh}
                            onopenvisit={handleOpenVisit}>
                        </c-visit-tile>
                    </template>
                </template>

                <template if:false={visits.length}>
                    <div class="empty-state">
                        <p class="empty-sub">No visits scheduled for this beat.</p>
                    </div>
                </template>
            </template>
        </div>

    </div>
</template>
