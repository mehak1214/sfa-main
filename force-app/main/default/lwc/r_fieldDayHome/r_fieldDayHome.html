<template>
    <div class="mobile">
        <template if:true={isDashboardScreen}>
            <section class="hero">
                <div class="hero-avatar">{userInitials}</div>
                <div class="hero-copy">
                    <span class="hero-small">FIELD DAY</span>
                    <h1>Welcome, {firstName}</h1>
                    <p>{journeyStateLabel}</p>
                </div>
                <template if:true={showStartDayButton}>
                    <button class="start-btn" onclick={handleStartDay}>Start Day</button>
                </template>
                <template if:true={showEndDayButton}>
                    <button class="end-btn" onclick={handleEndDay}>End Day</button>
                </template>
                <template if:true={showDayEndedButton}>
                    <button class="done-btn" disabled>Day Ended</button>
                </template>
            </section>

            <section class="dash-actions">
                <button class="action-btn primary" onclick={handleBeatToggle}>
                    <span>{beatLabel}</span>
                    <lightning-icon icon-name="utility:chevrondown" size="x-small" alternative-text="Select Beat"></lightning-icon>
                </button>

                <template if:true={showBeatDropdown}>
                    <div class="beat-list">
                        <template for:each={beatOptions} for:item="beat">
                            <button key={beat.Id}
                                    class={beat.rowClass}
                                    data-id={beat.Id}
                                    data-name={beat.Name}
                                    onclick={handleBeatSelect}>
                                <span>{beat.Name}</span>
                                <span class="beat-check">{beat.checkMark}</span>
                            </button>
                        </template>
                    </div>
                </template>
            </section>

            <section class="performance-head">
                <h2>My Performance</h2>
                <span class="month-chip">
                    <lightning-icon icon-name="utility:event" size="xx-small" alternative-text="Month"></lightning-icon>
                    This Month
                </span>
            </section>

            <section class="insight-card">
                <h3>Well Done!</h3>
                <p>Your productivity is {performanceLiftPercent}% higher than last month.</p>
            </section>

            <section class="incentive-card">
                <h3>Incentives</h3>
                <div class="amount-row">
                    <strong>{incentiveCurrentLabel}</strong>
                    <span>/{incentiveTargetLabel}</span>
                    <span class="inc-badge">{incentivePercent}%</span>
                </div>

                <div class="incentive-track">
                    <div class="track-base"></div>
                    <div class="track-dot start"></div>
                    <div class="track-dot mid"></div>
                    <div class="track-dot end"></div>
                </div>

                <div class="track-labels">
                    <span>{incentiveCurrentLabel}</span>
                    <span>{incentiveMidLabel}</span>
                    <span>{incentiveTargetLabel}</span>
                </div>
            </section>

            <section class="new-products">
                <div class="new-products-head">
                    <h3>New Products</h3>
                    <span>Fresh Picks</span>
                </div>

                <template for:each={newProducts} for:item="product">
                    <div key={product.id} class="product-item">
                        <div class="product-copy">
                            <strong>{product.name}</strong>
                            <span>{product.category}</span>
                        </div>
                        <button class="product-btn" type="button">Focus</button>
                    </div>
                </template>
            </section>
        </template>

        <template if:true={isFieldScreen}>
            <section class="field-header">
                <button class="back-btn" onclick={handleBackToDashboard}>&larr;</button>
                <div>
                    <span>Current Beat</span>
                    <h3>{beatLabel}</h3>
                </div>
            </section>

            <section class="date-strip">
                <button class="arrow" onclick={handlePrevWindow}>&lsaquo;</button>

                <template for:each={dateOptions} for:item="d">
                    <button key={d.value}
                            class={d.class}
                            data-date={d.value}
                            onclick={handleDateChange}>
                        <span class="day">{d.day}</span>
                        <span class="num">{d.date}</span>
                    </button>
                </template>

                <button class="today" onclick={handleTodayJump}>Today</button>
                <button class="arrow" onclick={handleNextWindow}>&rsaquo;</button>
            </section>

            <section class="segment">
                <button class={operationsTabClass}
                        data-screen="operations"
                        onclick={handleScreenChange}>
                    Operations
                </button>
                <button class={travelTabClass}
                        data-screen="travel"
                        onclick={handleScreenChange}>
                    Travel & Expense
                </button>
            </section>

            <template if:true={isOperationsScreen}>
                <section class="visit-tabs">
                    <button class={upcomingTabClass}
                            data-tab="upcoming"
                            onclick={handleVisitTabChange}>
                        Upcoming
                    </button>
                    <button class={ongoingTabClass}
                            data-tab="ongoing"
                            onclick={handleVisitTabChange}>
                        Ongoing
                    </button>
                    <button class={completedTabClass}
                            data-tab="completed"
                            onclick={handleVisitTabChange}>
                        Completed
                    </button>
                </section>

                <section class="visit-list">
                    <template if:true={filteredVisits.length}>
                        <template for:each={filteredVisits} for:item="visit">
                            <c-visit-tile
                                key={visit.Id}
                                visit={visit}
                                day-started={dayStarted}
                                day-ended={dayEnded}
                                is-today={isToday}
                                onopenvisit={handleOpenVisit}
                                onrefresh={handleRefresh}>
                            </c-visit-tile>
                        </template>
                    </template>

                    <template if:false={filteredVisits.length}>
                        <div class="empty">
                            <p>No visits found</p>
                            <span>Select another tab or date to view visits.</span>
                        </div>
                    </template>
                </section>
            </template>

            <template if:true={isTravelScreen}>
                <section class="travel-card">
                    <div class="travel-head">
                        <span>TRAVEL & EXPENSE</span>
                        <h3>{selectedDateLabel}</h3>
                    </div>

                    <div class="travel-box">
                        <span>DISTANCE</span>
                        <h4>{todayDistanceKmLabel}</h4>
                    </div>

                    <div class="travel-box">
                        <span>ELIGIBLE KM</span>
                        <h4>{eligibleDistanceKmLabel}</h4>
                    </div>

                    <div class="travel-box">
                        <span>EXPENSE</span>
                        <h4>{estimatedExpenseLabel}</h4>
                    </div>
                </section>
            </template>
        </template>
    </div>
</template>
