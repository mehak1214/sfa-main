<template>
    <lightning-card title="Create Order">

        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Select Franchise"
                value={selectedFranchise}
                options={franchiseOptions}
                onchange={handleFranchiseChange}>
            </lightning-combobox>
        </div>

        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Select Dealer/Distributor"
                value={selectedDistributor}
                options={distributorOptions}
                onchange={handleDistributorChange}>
            </lightning-combobox>
        </div>

        <div class="slds-grid slds-wrap slds-p-around_medium">
            <template for:each={products} for:item="prod">
                <div key={prod.productId}
                     class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_small">

                    <div class="slds-box slds-text-align_center">

                        <template if:true={prod.imageUrl}>
                            <img src={prod.imageUrl} class="product-image"/>
                        </template>

                        <h3 class="slds-text-heading_small slds-m-top_small">
                            {prod.productName}
                        </h3>

                        <div class="slds-m-top_small">
                            <lightning-button-icon
                                icon-name="utility:dash"
                                data-id={prod.productId}
                                onclick={decreaseQty}>
                            </lightning-button-icon>

                            <span class="slds-m-horizontal_small slds-text-heading_medium">
                                {prod.quantity}
                            </span>

                            <lightning-button-icon
                                icon-name="utility:add"
                                data-id={prod.productId}
                                onclick={increaseQty}>
                            </lightning-button-icon>
                        </div>

                        <!-- Schemes are shown only in the summary; removed from product grid -->

                    </div>
                </div>
            </template>
        </div>

        <!-- Summary of selected products -->
        <template if:true={selectedItemsForSummary.length}>
            <div class="slds-p-around_medium summary-box">
                <h3 class="slds-text-heading_small">Order Summary</h3>
                <div class="slds-m-top_small">

                    <template for:each={selectedItemsForSummary} for:item="item">
                        <div key={item.productId} class="summary-item-block">
                            <div class="summary-row">
                                <div class="summary-col">
                                    <div class="col-label">Product</div>
                                    <div class="col-value">{item.productName}</div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Scheme</div>
                                    <div class="col-value">
                                        <template if:true={item.schemes}>
                                            <template if:true={item.schemes.length}>
                                                <lightning-combobox
                                                    data-id={item.productId}
                                                    name="summaryScheme"
                                                    value={item.selectedSchemeId}
                                                    options={item.schemes}
                                                    placeholder="Select scheme"
                                                    onchange={handleSummarySchemeChange}>
                                                </lightning-combobox>
                                            </template>
                                            <template if:false={item.schemes.length}>
                                                <span>No schemes</span>
                                            </template>
                                        </template>
                                        <template if:false={item.schemes}>
                                            <span>No schemes</span>
                                        </template>
                                    </div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Qty</div>
                                    <div class="col-value">{item.quantity}</div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Unit Price</div>
                                    <div class="col-value">{item.unitPriceDisplay}</div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Subtotal</div>
                                    <div class="col-value">{item.lineTotalDisplay}</div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Discount</div>
                                    <div class="col-value">{item.discountAmountDisplay}</div>
                                </div>
                                <div class="summary-col">
                                    <div class="col-label">Total After Discount</div>
                                    <div class="col-value">{item.discountedTotalDisplay}</div>
                                </div>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </template>

        <!-- Total shown below the summary card -->
        <!-- Invoice-style totals (shown above total) -->
        <template if:true={selectedItemsForSummary.length}>
            <div class="invoice-totals slds-p-horizontal_medium slds-m-top_small">
                <div class="slds-grid slds-grid_align-end">
                    <div class="slds-col slds-size_1-of-3"></div>
                    <div class="slds-col slds-size_2-of-3">
                        <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                            <div class="slds-col slds-size_1-of-2">Subtotal:</div>
                            <div class="slds-col slds-size_1-of-2">{selectedItemsSubtotalDisplay}</div>
                            <div class="slds-col slds-size_1-of-2">Total Discount:</div>
                            <div class="slds-col slds-size_1-of-2">{selectedItemsTotalDiscountDisplay}</div>
                            <div class="slds-col slds-size_1-of-2 slds-text-bold">Grand Total:</div>
                            <div class="slds-col slds-size_1-of-2 slds-text-bold">{computedTotalPriceDisplay}</div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <div class="slds-align_absolute-center slds-p-around_medium">
            <lightning-button
                variant="brand"
                label="Place Order"
                onclick={saveOrder}>
            </lightning-button>
        </div>

    </lightning-card>
</template>
