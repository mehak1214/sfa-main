<template>


<lightning-card title="Create Order">

    <!-- STEP INDICATOR -->
    <lightning-progress-indicator current-step={currentStep} type="path">

        <lightning-progress-step label="Products" value="1"></lightning-progress-step>
        <lightning-progress-step label="Details" value="2"></lightning-progress-step>
        <lightning-progress-step label="Payment" value="3"></lightning-progress-step>

    </lightning-progress-indicator>


    <!-- ================= STEP 1 PRODUCTS ================= -->

    <template if:true={isStep1}>

        <!-- Franchise + Distributor -->

        <div class="slds-p-around_medium">

            <lightning-combobox
                label="Select Franchise"
                value={selectedFranchise}
                options={franchiseOptions}
                onchange={handleFranchiseChange}>
            </lightning-combobox>

            <lightning-combobox
                class="slds-m-top_small"
                label="Select Distributor"
                value={selectedDistributor}
                options={distributorOptions}
                onchange={handleDistributorChange}>
            </lightning-combobox>

        </div>


        <!-- PRODUCT GRID (YOUR ORIGINAL STYLE) -->

        <div class="slds-grid slds-wrap slds-p-around_medium">

            <template for:each={products} for:item="prod">

                <div key={prod.productId}
                     class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_small">

                    <div class="slds-box slds-text-align_center">

                        <template if:true={prod.imageUrl}>
                            <img src={prod.imageUrl} class="product-image"/>
                        </template>

                        <h3 class="slds-text-heading_small slds-m-top_small">
                            {prod.productName}
                        </h3>

                        <div class="slds-m-top_small">

                            <lightning-button-icon
                                icon-name="utility:dash"
                                data-id={prod.productId}
                                onclick={decreaseQty}>
                            </lightning-button-icon>

                            <span class="slds-m-horizontal_small slds-text-heading_medium">
                                {prod.quantity}
                            </span>

                            <lightning-button-icon
                                icon-name="utility:add"
                                data-id={prod.productId}
                                onclick={increaseQty}>
                            </lightning-button-icon>

                        </div>

                        <div class="slds-m-top_small">
                            ₹ {prod.unitPrice}
                        </div>

                    </div>

                </div>

            </template>

        </div>

        <div class="slds-align_absolute-center slds-p-around_medium">

            <lightning-button
                variant="brand"
                label="Checkout"
                onclick={goToStep2}>
            </lightning-button>

        </div>

    </template>



    <!-- ================= STEP 2 SUMMARY + ADDRESS ================= -->

    <template if:true={isStep2}>

        <div class="summary-box slds-m-around_medium">

            <h3 class="slds-text-heading_small">Order Summary</h3>

            <template for:each={selectedItemsForSummary} for:item="item">

                <div key={item.productId} class="summary-row">

                    <div>{item.productName}</div>
                    <div>Qty: {item.quantity}</div>
                    <div>₹ {item.lineTotalDisplay}</div>

                </div>

            </template>

            <div class="total-row">
                Total : ₹ {computedTotalPriceDisplay}
            </div>

        </div>


        <!-- BILLING -->

        <div class="slds-box slds-m-around_medium">

            <h3>Billing Details</h3>

            <lightning-input label="Street" data-field="billingStreet"
                             value={billingStreet}
                             onchange={handleInputChange}></lightning-input>

            <lightning-input label="City" data-field="billingCity"
                             value={billingCity}
                             onchange={handleInputChange}></lightning-input>

            <lightning-record-picker
                label="Bill To Contact"
                object-api-name="Contact"
                value={billToContactId}
                onchange={handleBillContactChange}>
            </lightning-record-picker>

        </div>


        <!-- SHIPPING -->

        <div class="slds-box slds-m-around_medium">

            <h3>Shipping Details</h3>

            <lightning-input label="Street" data-field="shippingStreet"
                             value={shippingStreet}
                             onchange={handleInputChange}></lightning-input>

            <lightning-input label="City" data-field="shippingCity"
                             value={shippingCity}
                             onchange={handleInputChange}></lightning-input>

            <lightning-record-picker
                label="Ship To Contact"
                object-api-name="Contact"
                value={shipToContactId}
                onchange={handleShipContactChange}>
            </lightning-record-picker>

        </div>


        <div class="slds-align_absolute-center slds-p-around_medium">

            <lightning-button
                label="Back"
                onclick={goToStep1}>
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Proceed to Payment"
                onclick={goToStep3}
                class="slds-m-left_small">
            </lightning-button>

        </div>

    </template>



    <!-- ================= STEP 3 PAYMENT ================= -->

    <template if:true={isStep3}>

        <div class="slds-box slds-m-around_medium">

            <h3>Payment</h3>

            <lightning-input
                type="number"
                label="Payment Amount"
                value={paymentAmount}
                onchange={handlePaymentChange}>
            </lightning-input>

            <lightning-combobox
                label="Payment Mode"
                value={paymentMode}
                options={paymentModeOptions}
                onchange={handlePaymentModeChange}>
            </lightning-combobox>

            <div class="slds-m-top_small">
                Total Amount : ₹ {computedTotalPriceDisplay}
            </div>

        </div>


        <div class="slds-align_absolute-center slds-p-around_medium">

            <lightning-button
                label="Back"
                onclick={goToStep2}>
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Place Order"
                onclick={saveOrder}
                class="slds-m-left_small">
            </lightning-button>

        </div>

    </template>

</lightning-card>


</template>
