<template>
    <div class={wrapperClass}>
        <template if:true={showConnector}>
            <div class="connector-col">
                <div class={dotClass}></div>
                <div class="line"></div>
            </div>
        </template>

    <!-- MOVE CLICK HERE -->
    <div class={cardClass}
         role="button"
         tabindex="0"
         onclick={handleCardClick}
         onkeydown={handleCardKeydown}>

        <div class="card-body">

                <div class="top-row">
                    <div class="title-block">
                        <strong class="outlet-name">{outletName}</strong>
                    </div>
                    <button class="map-circle-btn"
                            type="button"
                            onclick={navigateToMap}
                            title="View Map">
                        <lightning-icon
                            icon-name="utility:location"
                            size="x-small"
                            alternative-text="View Map">
                        </lightning-icon>
                    </button>
                </div>

                <p class="address">
                    <lightning-icon
                        class="address-icon"
                        icon-name="utility:home"
                        size="x-small"
                        alternative-text="">
                    </lightning-icon>
                    <span class="address-text">{outletAddress}</span>
                </p>

                <div class="footer-row">
                    <span class={statusBadgeClass}>{visitStatus}</span>
                </div>

            </div>
        </div>
    </div>
</template>
