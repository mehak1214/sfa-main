<template>
    <section class="page" role="dialog" aria-modal="true">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
        </template>

        <div class="sheet">
            <!-- Hero / Header -->
            <div class="hero">
                <div class="hero-top">
                    <button class="icon-pill" onclick={handleClose} type="button" title="Back">
                        <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
                        <span>Back</span>
                    </button>
                    <div class="hero-badges">
                        <span class="badge-label">Visit Status</span>
                        <span class={statusBadgeClass}>{visitStatus}</span>
                    </div>
                </div>

                <div class="hero-body">
                    <div class="hero-text">
                        <p class="eyebrow">Visit #{sequenceLabel}</p>
                        <h2 class="title">{outletName}</h2>
                        <p class="address">{outletAddress}</p>

                        <div class="hero-actions">
                            <button class="map-mini-btn" onclick={navigateToMap} type="button" disabled={mapDisabled} title="Directions">
                                <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                <span class="map-mini-label">Directions</span>
                            </button>
                        </div>
                    </div>

                    <template if:true={hasOutletPhoto}>
                        <div class="hero-photo">
                            <img src={outletPhotoUrl} alt="Outlet photo" />
                        </div>
                    </template>
                </div>
            </div>

            <div class="content">
                <!-- Visit Timing -->
                <div class="card">
                    <div class="card-head">
                        <span class="card-title">Timing</span>
                    </div>
                    <div class="detail-grid">
                        <div class="detail">
                            <p class="label">Planned Window</p>
                            <p class="value">{plannedStart} - {plannedEnd}</p>
                        </div>
                        <div class="detail">
                            <p class="label">Check-in / out</p>
                            <p class="value">{checkInTime} - {checkOutTime}</p>
                        </div>
                        <div class="detail">
                            <p class="label">Duration</p>
                            <p class="value">{duration}</p>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="card">
                    <div class="card-head">
                        <span class="card-title">Actions</span>
                    </div>
                    <div class="action-grid">
                        <template if:true={actionInFlight}>
                            <div class="action-helper">Grabbing your GPS location...</div>
                        </template>
                        <template if:true={showCheckIn}>
                            <button class="btn success action-main" onclick={handleCheckIn} type="button" disabled={actionInFlight}>
                                <lightning-icon icon-name="utility:checkin" size="x-small"></lightning-icon>
                                <span>Check In</span>
                            </button>
                        </template>

                        <template if:true={showCheckOut}>
                            <button class="btn danger action-main" onclick={handleCheckOut} type="button" disabled={actionInFlight}>
                                <lightning-icon icon-name="utility:logout" size="x-small"></lightning-icon>
                                <span>Check Out</span>
                            </button>
                        </template>

                        <template if:true={hasVisitPhoto}>
                            <button class="btn secondary action-photo" onclick={handleOpenPhotoModal} type="button" title="Preview Visit Photo">
                                <lightning-icon icon-name="utility:image" size="x-small"></lightning-icon>
                                <span>Preview Visit Photo</span>
                            </button>
                        </template>

                        <template if:false={hasVisitPhoto}>
                            <button class="btn secondary action-photo" onclick={handleTakePhoto} type="button">
                                <lightning-icon icon-name="utility:camera" size="x-small"></lightning-icon>
                                <span>Take Visit Photo</span>
                            </button>
                        </template>

                        <button class="btn primary action-order" onclick={handleToggleOrderPanel} type="button">
                            <lightning-icon icon-name="utility:cart" size="x-small"></lightning-icon>
                            <span>{orderToggleLabel}</span>
                        </button>

                    </div>
                </div>

                <template if:true={showOrderPanel}>
                    <div class="card order-card">
                        <div class="card-head">
                            <span class="card-title">Order</span>
                        </div>
                        <c-place-order></c-place-order>
                    </div>
                </template>

            </div>
        </div>

        <!-- Photo modal -->
        <template if:true={isPhotoModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="visitPhotoModalHeading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__content slds-p-around_medium" id="visitPhotoModalContent">
                        <template if:true={hasVisitPhoto}>
                            <img src={imageUrl} alt="Visit Photo" class="photo-preview" />
                        </template>
                        <template if:false={hasVisitPhoto}>
                            <p>No photo available.</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="btn danger" onclick={handleDeletePhoto} type="button">
                            Delete Photo
                        </button>
                        <button class="btn secondary" onclick={handleClosePhotoModal} type="button">Close</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </section>
</template>
